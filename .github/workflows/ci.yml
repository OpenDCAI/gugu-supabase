name: Community backend
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.4
      - run: pnpm check:functions
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      GUGU_INSTALL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable
      # The Supabase CLI pulls from public.ecr.aws by default, whose anonymous quota is shared by
      # GitHub-hosted runner IPs and runs out ("toomanyrequests: Data limit exceeded"). Supabase
      # mirrors the same images to GHCR. GHCR in turn rate-limits anonymous pulls per image owner
      # ("toomanyrequests: ... allowed: 44000/minute", shared by everyone pulling supabase/* anonymously),
      # so the pulls are authenticated: the CLI sends the Docker credentials stored for this registry.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Log in to GHCR so Supabase image pulls are authenticated
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - run: pnpm test:db:start
      - run: pnpm test:installation
      - run: pnpm test:integration
      - if: ${{ always() }}
        run: pnpm test:db:stop
