project_id = "gugu-community"

[api]
enabled = true
port = 54321
schemas = ["public", "identity", "chat", "moments", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
enable_signup = true

[storage]
enabled = true
file_size_limit = "25MiB"

[realtime]
enabled = true

[functions.server-login]
verify_jwt = false

# Handler checks the user token with Auth; GC accepts only the server credential.
[functions.attachments]
verify_jwt = false
