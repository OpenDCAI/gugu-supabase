name: Community backend
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.4
      - run: pnpm check:functions
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GUGU_INSTALL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable
      # The Supabase CLI pulls from public.ecr.aws by default, whose anonymous quota is shared by
      # GitHub-hosted runner IPs and runs out ("toomanyrequests: Data limit exceeded"). Supabase
      # mirrors the same images to GHCR, which hosted runners reach without that quota.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The images `supabase start` needs are pinned by the CLI version, so they are cached under it.
      # A hit loads them locally and the CLI pulls nothing (it only pulls images it does not have);
      # a miss pulls from the registry once and saves them for the next run.
      - name: Supabase image cache key
        id: images
        run: echo "key=supabase-images-$(pnpm exec supabase --version)-$SUPABASE_INTERNAL_IMAGE_REGISTRY" >> "$GITHUB_OUTPUT"
      - name: Restore Supabase images
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/supabase-images.tar
          key: ${{ steps.images.outputs.key }}
      - name: Load Supabase images
        if: steps.restore.outputs.cache-hit == 'true'
        run: docker load -i /tmp/supabase-images.tar
      - run: pnpm test:db:start
      - name: Export Supabase images
        if: steps.restore.outputs.cache-hit != 'true'
        run: docker save -o /tmp/supabase-images.tar $(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '(^|/)supabase/')
      - name: Save Supabase images
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/supabase-images.tar
          key: ${{ steps.images.outputs.key }}
      - run: pnpm test:installation
      - run: pnpm test:integration
      - if: ${{ always() }}
        run: pnpm test:db:stop
